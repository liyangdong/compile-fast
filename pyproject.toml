[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compile-fast"
version = "0.2.0"
description = "Conservative Java compilation verification for coding agents, implemented in Python"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
semantic = ["tree-sitter>=0.25,<0.26", "tree-sitter-java>=0.23,<0.24"]
rewrite = ["JPype1>=1.6,<2"]

[project.scripts]
compile-fast = "compile_fast.cli:main"

[tool.setuptools.packages.find]
include = ["compile_fast*"]

[tool.setuptools.package-data]
compile_fast = ["*.gradle"]
